<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Eilik AI Companion</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Face Area */
    #face {
      position: relative;
      width: 300px;
      height: 160px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* SVG Eye containers */
    .eye-svg {
      width: 95px;
      height: 120px;
      filter: drop-shadow(0 0 20px rgba(0, 220, 245, 0.85)) drop-shadow(0 0 45px rgba(0, 220, 245, 0.4));
      transition: transform 0.15s ease;
    }

    /* Normal Eye Shape */
    .eye-path {
      fill: #00e5ff;
      transition: d 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Touch Controls */
    .controls {
      position: absolute;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-bar {
      display: flex;
      gap: 14px;
    }

    button {
      background: rgba(0, 229, 255, 0.12);
      border: 1.5px solid #00e5ff;
      color: #7df9ff;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 22px;
      cursor: pointer;
    }

    button:active {
      background: rgba(0, 229, 255, 0.4);
      transform: scale(0.95);
    }

    #status {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <!-- Animated Face -->
  <div id="face">
    <!-- Left Eye -->
    <svg class="eye-svg" id="left-eye" viewBox="0 0 100 130">
      <path class="eye-path" id="left-path" d="M 50 5 C 75 5, 95 30, 95 65 C 95 100, 75 125, 50 125 C 25 125, 5 100, 5 65 C 5 30, 25 5, 50 5 Z" />
    </svg>

    <!-- Right Eye -->
    <svg class="eye-svg" id="right-eye" viewBox="0 0 100 130">
      <path class="eye-path" id="right-path" d="M 50 5 C 75 5, 95 30, 95 65 C 95 100, 75 125, 50 125 C 25 125, 5 100, 5 65 C 5 30, 25 5, 50 5 Z" />
    </svg>
  </div>

  <div class="controls">
    <div id="status">Tap face or buttons below</div>
    <div class="btn-bar">
      <button id="btn-talk">🎤 Talk</button>
      <button id="btn-music">🎵 Play Music</button>
    </div>
  </div>

  <audio id="music-player" loop preload="none"></audio>

  <script>
    const leftPath = document.getElementById('left-path');
    const rightPath = document.getElementById('right-path');
    const leftEye = document.getElementById('left-eye');
    const rightEye = document.getElementById('right-eye');
    const face = document.getElementById('face');
    const status = document.getElementById('status');
    const btnTalk = document.getElementById('btn-talk');
    const btnMusic = document.getElementById('btn-music');
    const musicPlayer = document.getElementById('music-player');

    // SVG Vector Paths for Smooth Eilik Expressions
    const PATH_NORMAL = "M 50 5 C 75 5, 95 30, 95 65 C 95 100, 75 125, 50 125 C 25 125, 5 100, 5 65 C 5 30, 25 5, 50 5 Z";
    const PATH_BLINK  = "M 50 60 C 75 60, 95 62, 95 65 C 95 68, 75 70, 50 70 C 25 70, 5 68, 5 65 C 5 62, 25 60, 50 60 Z";
    // Real curved smiling arch (crescent) instead of flat dome:
    const PATH_HAPPY  = "M 10 70 C 15 25, 85 25, 90 70 C 80 48, 20 48, 10 70 Z";

    let isBusy = false;

    // 1. Natural Blinking Loop
    function scheduleBlink() {
      const wait = Math.random() * 3200 + 1800;
      setTimeout(() => {
        if (!isBusy) {
          leftPath.setAttribute('d', PATH_BLINK);
          rightPath.setAttribute('d', PATH_BLINK);
          setTimeout(() => {
            if (!isBusy) {
              leftPath.setAttribute('d', PATH_NORMAL);
              rightPath.setAttribute('d', PATH_NORMAL);
            }
          }, 110);
        }
        scheduleBlink();
      }, wait);
    }
    scheduleBlink();

    // 2. Pet / Tickle Animation
    function triggerHappy() {
      isBusy = true;
      leftPath.setAttribute('d', PATH_HAPPY);
      rightPath.setAttribute('d', PATH_HAPPY);
      face.style.transform = "rotate(4deg) scale(1.05)";
      status.innerText = "Hehe! (^_^)";
      speak("That tickles!");

      setTimeout(() => {
        face.style.transform = "rotate(-4deg) scale(1.05)";
      }, 200);

      setTimeout(() => {
        face.style.transform = "none";
        leftPath.setAttribute('d', PATH_NORMAL);
        rightPath.setAttribute('d', PATH_NORMAL);
        status.innerText = "Tap face or buttons below";
        isBusy = false;
      }, 1600);
    }
    face.addEventListener('click', triggerHappy);

    // 3. Audio & Text-to-Speech
    function speak(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'en-US';
      utter.pitch = 1.35;
      utter.rate = 1.05;
      window.speechSynthesis.speak(utter);
    }

    // 4. Music Playback
    let playing = false;
    btnMusic.addEventListener('click', () => {
      if (!playing) {
        musicPlayer.src = "https://streams.ilovemusic.de/iloveradio17.mp3";
        musicPlayer.play().then(() => {
          playing = true;
          btnMusic.innerText = "⏸ Pause Music";
          status.innerText = "Playing Lo-Fi stream...";
        }).catch(e => {
          status.innerText = "Tap screen first to permit audio";
        });
      } else {
        musicPlayer.pause();
        playing = false;
        btnMusic.innerText = "🎵 Play Music";
        status.innerText = "Music stopped";
      }
    });

    // 5. Speech Recognition (Talk)
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRec) {
      const recognition = new SpeechRec();
      recognition.lang = 'en-US';

      btnTalk.addEventListener('click', () => {
        recognition.start();
        leftEye.style.transform = "scale(1.15)";
        rightEye.style.transform = "scale(1.15)";
        status.innerText = "Listening...";
      });

      recognition.onresult = (e) => {
        leftEye.style.transform = "none";
        rightEye.style.transform = "none";
        const text = e.results[0][0].transcript.toLowerCase();
        status.innerText = `You: "${text}"`;

        if (text.includes("music") || text.includes("play")) {
          btnMusic.click();
          speak("Playing music for you!");
        } else if (text.includes("stop")) {
          if (playing) btnMusic.click();
          speak("Stopping music.");
        } else {
          speak("You said: " + text);
        }
      };

      recognition.onerror = () => {
        leftEye.style.transform = "none";
        rightEye.style.transform = "none";
        status.innerText = "Didn't catch that. Tap talk again.";
      };
    } else {
      btnTalk.style.display = "none";
      status.innerText = "Voice API not supported in this browser.";
    }
  </script>
</body>
</html>
