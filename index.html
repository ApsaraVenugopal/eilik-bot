<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Eilik AI</title>
  <style>
    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    #face {
      position: relative;
      width: 320px;
      height: 180px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Clean Glowing SVG Eyes (No bounding box artifacts) */
    .eye-svg {
      width: 120px;
      height: 160px;
      overflow: visible;
    }

    .eye-path {
      fill: #00e5ff;
      filter: drop-shadow(0 0 16px #00e5ff) drop-shadow(0 0 35px rgba(0, 229, 255, 0.6));
      transition: d 0.12s ease-out;
    }

    /* Subdued Status Text */
    #status {
      position: absolute;
      bottom: 30px;
      color: rgba(0, 229, 255, 0.4);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="face">
    <!-- Left Eye -->
    <svg class="eye-svg" viewBox="0 0 100 140">
      <path class="eye-path" id="left-eye" d="M 50 10 C 80 10, 95 35, 95 70 C 95 105, 80 130, 50 130 C 20 130, 5 105, 5 70 C 5 35, 20 10, 50 10 Z" />
    </svg>

    <!-- Right Eye -->
    <svg class="eye-svg" viewBox="0 0 100 140">
      <path class="eye-path" id="right-eye" d="M 50 10 C 80 10, 95 35, 95 70 C 95 105, 80 130, 50 130 C 20 130, 5 105, 5 70 C 5 35, 20 10, 50 10 Z" />
    </svg>
  </div>

  <div id="status">Tap anywhere to wake up</div>

  <audio id="music-player" loop preload="none"></audio>

  <script>
    const leftEye = document.getElementById('left-eye');
    const rightEye = document.getElementById('right-eye');
    const face = document.getElementById('face');
    const status = document.getElementById('status');
    const musicPlayer = document.getElementById('music-player');

    // SVG Vector Coordinates
    const SHAPE_NORMAL = "M 50 10 C 80 10, 95 35, 95 70 C 95 105, 80 130, 50 130 C 20 130, 5 105, 5 70 C 5 35, 20 10, 50 10 Z";
    const SHAPE_BLINK  = "M 50 68 C 80 68, 95 69, 95 70 C 95 71, 80 72, 50 72 C 20 72, 5 71, 5 70 C 5 69, 20 68, 50 68 Z";
    // Curved upward smiling crescent:
    const SHAPE_HAPPY  = "M 10 75 C 20 20, 80 20, 90 75 C 75 42, 25 42, 10 75 Z";

    let isAwake = false;
    let isBusy = false;
    let isPlayingMusic = false;
    let recognition = null;

    // 1. Natural Blinking Loop
    function blinkLoop() {
      const wait = Math.random() * 3200 + 2000;
      setTimeout(() => {
        if (!isBusy) {
          leftEye.setAttribute('d', SHAPE_BLINK);
          rightEye.setAttribute('d', SHAPE_BLINK);
          setTimeout(() => {
            if (!isBusy) {
              leftEye.setAttribute('d', SHAPE_NORMAL);
              rightEye.setAttribute('d', SHAPE_NORMAL);
            }
          }, 110);
        }
        blinkLoop();
      }, wait);
    }
    blinkLoop();

    // 2. Cute Robot Voice Synthesis
    function speak(text, onComplete) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.pitch = 1.4; // Robot tone
      utterance.rate = 1.05;

      utterance.onstart = () => {
        isBusy = true;
        status.innerText = text;
      };

      utterance.onend = () => {
        isBusy = false;
        leftEye.setAttribute('d', SHAPE_NORMAL);
        rightEye.setAttribute('d', SHAPE_NORMAL);
        status.innerText = "Listening...";
        if (onComplete) onComplete();
      };

      window.speechSynthesis.speak(utterance);
    }

    // 3. Alexa-Style Continuous Listening
    function initSpeech() {
      const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechClass) {
        status.innerText = "Speech not supported in this browser";
        return;
      }

      recognition = new SpeechClass();
      recognition.continuous = false; // Mobile browsers operate best restarting per utterance
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        if (!isBusy) status.innerText = "Listening...";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript.toLowerCase();
        status.innerText = `"${text}"`;
        handleIntent(text);
      };

      recognition.onerror = (e) => {
        // Auto-restart on silent timeouts
        if (isAwake && !isBusy) {
          setTimeout(startListening, 300);
        }
      };

      recognition.onend = () => {
        if (isAwake && !isBusy) {
          setTimeout(startListening, 300);
        }
      };
    }

    function startListening() {
      if (recognition && isAwake && !isBusy) {
        try { recognition.start(); } catch (e) {}
      }
    }

    // 4. Intent Handler
    function handleIntent(command) {
      if (command.includes("play") || command.includes("music") || command.includes("song")) {
        musicPlayer.src = "https://streams.ilovemusic.de/iloveradio17.mp3";
        musicPlayer.play();
        isPlayingMusic = true;
        speak("Playing your music station now!");
      } 
      else if (command.includes("stop") || command.includes("quiet") || command.includes("pause")) {
        if (isPlayingMusic) {
          musicPlayer.pause();
          isPlayingMusic = false;
          speak("Music stopped.");
        } else {
          speak("I am quiet!");
        }
      } 
      else if (command.includes("hello") || command.includes("hi")) {
        triggerHappyReaction("Hello! Nice to meet you!");
      } 
      else if (command.includes("who are you") || command.includes("what is your name")) {
        triggerHappyReaction("I am your desktop companion!");
      } 
      else {
        // Echo conversation / chat reply
        speak("I heard you say: " + command);
      }
    }

    // 5. Happy Smile Animation
    function triggerHappyReaction(replyText) {
      isBusy = true;
      leftEye.setAttribute('d', SHAPE_HAPPY);
      rightEye.setAttribute('d', SHAPE_HAPPY);
      face.style.transform = "rotate(5deg) scale(1.05)";

      setTimeout(() => { face.style.transform = "rotate(-5deg) scale(1.05)"; }, 180);
      setTimeout(() => { face.style.transform = "none"; }, 360);

      speak(replyText || "Hehe! (^_^)", () => {
        leftEye.setAttribute('d', SHAPE_NORMAL);
        rightEye.setAttribute('d', SHAPE_NORMAL);
        isBusy = false;
      });
    }

    // 6. First Touch Unlocks Audio & Starts Listening
    window.addEventListener('click', () => {
      if (!isAwake) {
        isAwake = true;
        // Unlock mobile audio
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(''));
        initSpeech();
        triggerHappyReaction("I am awake! Tell me anything or say play music.");
      } else if (!isBusy) {
        triggerHappyReaction("That tickles!");
      }
    });
  </script>
</body>
</html>
